# Groups auto-generated release notes by PR label (see RELEASING.md).
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: ✨ 새 기능
      labels:
        - feature
        - enhancement
    - title: 🐛 버그 수정
      labels:
        - bug
        - fix
    - title: 📝 문서
      labels:
        - documentation
        - docs
    - title: 🔧 기타 변경
      labels:
        - "*"
