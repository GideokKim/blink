name: 🐛 버그 신고
description: Blink에서 발생한 문제를 알려주세요
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 제보해 주셔서 감사합니다. 아래 항목을 채워주시면 더 빠르게 확인할 수 있어요.
  - type: input
    id: version
    attributes:
      label: Blink 버전
      description: 설정 창 하단에 표시됩니다.
      placeholder: "0.6.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 버전
      description: "`Win + R` → `winver` 로 확인할 수 있습니다."
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 단계를 순서대로 적어주세요.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 오류 메시지나 스크린샷이 있으면 함께 첨부해 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 추가 정보 (선택)
      description: 검색 대상(로컬/NAS), 파일 종류(hwpx·pdf 등), 보안 솔루션(EDR/백신) 같은 환경 특이사항.
    validations:
      required: false
