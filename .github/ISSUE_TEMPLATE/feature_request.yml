name: ✨ 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해주세요
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하고 싶나요?
      description: 불편했던 상황이나 배경을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 방법
      description: 어떻게 동작하면 좋을지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 (선택)
    validations:
      required: false
