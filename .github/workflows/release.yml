name: Release

# Cut a release by pushing a version tag:  git tag v1.2.3 && git push origin v1.2.3
# (or run manually from the Actions tab with a version). Builds the installer on Windows
# and publishes a GitHub Release with auto-generated notes and the Setup .exe attached.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 1.2.3 or 0.0.1-test)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    # Code signing turns on automatically once the SignPath secret is configured.
    # Until then every signing step below is skipped and the release is published
    # unsigned exactly as before — so this is safe to merge before SignPath is set up.
    # See RELEASING.md → "Code signing (SignPath)" for the one-time setup.
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v?',''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          if (-not $v) { throw 'Could not resolve a version' }
          # Pre-release when the version carries a semver pre-release suffix (e.g. 0.0.1-test,
          # 1.2.0-rc1, -beta, -alpha), or when the manual run requests it.
          $pre = if ($v -match '-') { 'true' } else { 'false' }
          if ('${{ github.event.inputs.prerelease }}' -eq 'true') { $pre = 'true' }
          "version=$v"      >> $env:GITHUB_OUTPUT
          "tag=v$v"         >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v (prerelease=$pre)"

      - name: Test engine
        run: dotnet test Blink.Core.Tests -c Release

      # -p:Version stamps AssemblyInformationalVersion so the app knows its own version
      # (the in-app updater compares it against the latest release tag).
      - name: Publish app (self-contained, single file)
        run: >
          dotnet publish Blink.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish indexer worker (self-contained, single file)
        run: >
          dotnet publish Blink.Indexer.Worker -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}

      # --- Sign the app + worker exes BEFORE packaging (so the installed binaries
      #     are signed too). Inner files can't be signed after Inno Setup bundles them.
      #     All three signing steps no-op unless SIGNING_ENABLED is true. ---
      - name: Stage binaries for signing
        if: env.SIGNING_ENABLED == 'true'
        run: |
          New-Item -ItemType Directory -Force sign-in/binaries | Out-Null
          Copy-Item Blink.App/bin/Release/net8.0-windows/win-x64/publish/Blink.App.exe        sign-in/binaries/
          Copy-Item Blink.Indexer.Worker/bin/Release/net8.0/win-x64/publish/Blink.Indexer.Worker.exe sign-in/binaries/

      - name: Upload unsigned binaries
        if: env.SIGNING_ENABLED == 'true'
        id: artifact-binaries
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries
          path: sign-in/binaries

      - name: Sign binaries (SignPath)
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          # These three slugs must match what you define in the SignPath portal.
          project-slug: blink
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.artifact-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: sign-out/binaries

      - name: Copy signed binaries back into publish output
        if: env.SIGNING_ENABLED == 'true'
        run: |
          Copy-Item sign-out/binaries/Blink.App.exe            Blink.App/bin/Release/net8.0-windows/win-x64/publish/ -Force
          Copy-Item sign-out/binaries/Blink.Indexer.Worker.exe Blink.Indexer.Worker/bin/Release/net8.0/win-x64/publish/ -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.ver.outputs.version }}
          installer\blink.iss

      # --- Sign the final installer. Output overwrites the unsigned Setup.exe in
      #     installer/Output, so the release upload step below needs no changes. ---
      - name: Upload unsigned installer
        if: env.SIGNING_ENABLED == 'true'
        id: artifact-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: installer/Output/Blink-Setup-*.exe

      - name: Sign installer (SignPath)
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: blink
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.artifact-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/Output

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Blink ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: installer/Output/Blink-Setup-*.exe

      # Publish the in-app update manifest (CDN-served, avoids the REST API rate limit)
      # and append the web-only donation footer. Runs after the release exists.
      - name: Publish update manifest + support footer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ steps.ver.outputs.tag }}'
          $ver  = '${{ steps.ver.outputs.version }}'
          $repo = '${{ github.repository }}'
          # Clean auto-generated notes as a single string (footer added separately below).
          $body = (gh release view $tag --json body --jq .body | Out-String).TrimEnd()

          # latest.json — read by the in-app updater via the stable CDN URL
          # https://github.com/<repo>/releases/latest/download/latest.json, which always
          # redirects to the latest *stable* release's asset (not the 60/h REST API).
          $installerName = "Blink-Setup-$ver.exe"
          $manifest = [ordered]@{
            version       = $ver
            tag           = $tag
            notes         = $body
            installerName = $installerName
            installerUrl  = "https://github.com/$repo/releases/download/$tag/$installerName"
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          gh release upload $tag latest.json --clobber

          # Donation footer (QR) — WEB release notes only. The <!--BLINK_NOTES_END--> sentinel
          # lets the in-app renderer drop it (MarkdownLite can't render the table/img).
          $base = "https://raw.githubusercontent.com/$repo/$tag/Blink.App/Assets"
          $footer = "`n`n<!--BLINK_NOTES_END-->`n`n---`n`n### ☕ Blink가 시간을 아껴줬다면`n`n커피 한 잔으로 응원해주세요. 계속 만들어 갈 큰 힘이 됩니다.`n`n| 카카오페이 | 토스 |`n|:--:|:--:|`n| <img src=`"$base/donate-kakaopay.png`" width=`"180`"> | <img src=`"$base/donate-toss.png`" width=`"180`"> |`n`n[카카오페이 링크로 보내기](https://qr.kakaopay.com/281006011000003981911022)"
          Set-Content -Path release-notes.md -Value ($body + $footer) -Encoding utf8
          gh release edit $tag --notes-file release-notes.md
