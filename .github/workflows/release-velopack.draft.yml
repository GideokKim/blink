# Blink — Velopack release pipeline (DRAFT).
#
# UNVERIFIED (authored on macOS, never run). This is a DRAFT kept separate from the live
# release.yml so the existing Inno pipeline keeps working (plan invariant: main is always
# releasable). Validate on a Windows runner via a pre-release tag, then fold into release.yml
# and retire the Inno path (plan Phase 4). `vpk` flags/commands MUST be confirmed against the
# installed vpk version — they drift between releases.
#
# Dual-publish window: until all users have crossed the bridge, this can run ALONGSIDE the Inno
# build so both `latest.json` (old channel) and `releases.win.json` (Velopack feed) exist.

name: Release (Velopack draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 1.2.3)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { throw 'Could not resolve a version' }
          $pre = if ($v -match '-') { 'true' } else { 'false' }
          if ('${{ github.event.inputs.prerelease }}' -eq 'true') { $pre = 'true' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT

      - name: Test engine
        run: dotnet test Blink.Core.Tests -c Release

      - name: Install vpk
        # UNVERIFIED: pin the vpk tool version to match the Velopack NuGet in Blink.App.csproj.
        run: dotnet tool install -g vpk

      # NOTE: folder publish (NO -p:PublishSingleFile) — Velopack packs a directory.
      - name: Publish app (self-contained, folder)
        run: >
          dotnet publish Blink.App -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/app

      - name: Publish indexer worker (self-contained, folder)
        run: >
          dotnet publish Blink.Indexer.Worker -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/worker

      # The worker must live IN the app's pack dir (Velopack packs a single directory).
      # The old Inno script added it via a second [Files] source; replicate that here.
      - name: Stage worker into app publish dir
        run: Copy-Item publish/worker/Blink.Indexer.Worker.exe publish/app/ -Force

      # --- Sign inner exes BEFORE packing (Velopack bundles them; can't sign after). ---
      - name: Sign binaries (SignPath)
        if: env.SIGNING_ENABLED == 'true'
        # UNVERIFIED: reuse the existing signpath action + slugs from release.yml.
        run: |
          echo "TODO - sign publish/app/Blink.App.exe + Blink.Indexer.Worker.exe via SignPath"

      - name: Pack with Velopack
        # UNVERIFIED: confirm vpk pack flags. --mainExe is the launcher; --packDir is the folder
        # that becomes current/. Produces *-full.nupkg, *-delta.nupkg, releases.win.json, Setup.exe.
        run: >
          vpk pack
          --packId Blink
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish/app
          --mainExe Blink.App.exe
          --packTitle Blink

      # --- Sign the Velopack Setup.exe AFTER packing (third artifact-configuration-slug). ---
      - name: Sign Velopack Setup (SignPath)
        if: env.SIGNING_ENABLED == 'true'
        run: |
          echo "TODO - sign the Velopack Setup .exe (new artifact-configuration-slug)"

      - name: Upload to GitHub Releases
        # `vpk upload github` takes the token via --token (NOT the GH_TOKEN env var).
        # The auto-provided GITHUB_TOKEN has contents:write (see permissions above).
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Blink ${{ steps.ver.outputs.tag }}"
          --tag ${{ steps.ver.outputs.tag }}
          ${{ steps.ver.outputs.prerelease == 'true' && '--pre' || '' }}

      # `vpk upload` creates the release with an EMPTY body. Compose the hybrid notes the
      # same way release.yml (Inno) does and patch them in via `gh release edit`, so the
      # in-app "새로워진 점" window (which reads release.Body via the GitHub API, unlike the
      # Inno app that read latest.json) is never blank. NOTE: latest.json is NOT produced
      # here — that manifest is Inno-only; Velopack updates read releases.win.json.
      #
      #   highlights — hand-written, user-facing, from CHANGELOG.md (single source of truth).
      #   detail     — auto-grouped commits since the previous tag (web-only, collapsible).
      #
      # The <!--BLINK_NOTES_END--> sentinel is placed right AFTER the highlights: MarkdownView
      # cuts the body there, so the app shows ONLY the highlights while the web release page
      # still renders the collapsible detail below it.
      - name: Compose release notes (CHANGELOG + commit detail)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = '${{ steps.ver.outputs.tag }}'
          $ver  = '${{ steps.ver.outputs.version }}'
          $repo = '${{ github.repository }}'

          # --- 1) Highlights: the CHANGELOG.md section for this version (falls back to
          #        [Unreleased] if it hasn't been stamped with the version yet). ---
          function Get-Changelog([string]$path, [string]$version) {
            if (-not (Test-Path $path)) { return '' }
            $lines = Get-Content -Path $path -Encoding utf8
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s*\[$([regex]::Escape($version))\]") { $start = $i; break }
            }
            if ($start -lt 0) {
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s*\[Unreleased\]') { $start = $i; break }
              }
            }
            if ($start -lt 0) { return '' }
            $out = @()
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s') { break }
              $out += $lines[$i]
            }
            return (($out -join "`n").Trim())
          }
          $highlights = Get-Changelog 'CHANGELOG.md' $ver

          # --- 2) Detail: commits since the previous tag grouped by Conventional Commit type.
          #        HEAD is the release commit (vpk created $tag at it). --no-merges drops the
          #        umbrella merge commits, leaving the typed leaves. ---
          $prev  = (git describe --tags --abbrev=0 HEAD^ 2>$null)
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $subjects = @(git log $range --no-merges --pretty=format:'%s')
          $groups = [ordered]@{
            '✨ 새 기능' = @(); '🐛 버그 수정' = @(); '⚡ 성능' = @(); '📝 문서' = @(); '🔧 기타 변경' = @()
          }
          foreach ($s in $subjects) {
            if (-not $s) { continue }
            if ($s -match '^(\w+)(\([^)]*\))?!?:\s*(.+)$') {
              $type  = $matches[1].ToLower()
              $scope = if ($matches[2]) { $matches[2].Trim('(', ')') + ': ' } else { '' }
              $desc  = $matches[3].Trim()
              $cat = switch ($type) {
                'feat' { '✨ 새 기능' } 'fix' { '🐛 버그 수정' } 'perf' { '⚡ 성능' }
                'docs' { '📝 문서' } default { '🔧 기타 변경' }
              }
              $groups[$cat] += "- $scope$desc"
            } else {
              $groups['🔧 기타 변경'] += "- $s"
            }
          }
          $detailParts = @()
          foreach ($k in $groups.Keys) {
            if ($groups[$k].Count -gt 0) { $detailParts += "#### $k`n" + ($groups[$k] -join "`n") }
          }
          $detail = ($detailParts -join "`n`n").Trim()
          if ($prev) { $detail = ($detail + "`n`n**전체 변경 내역**: https://github.com/$repo/compare/$prev...$tag").Trim() }

          # --- 3) Body: $appNotes ABOVE the sentinel (all the app shows), the collapsible
          #        commit detail (web-only) BELOW it. Falls back to $detail when no CHANGELOG
          #        entry exists so the app card is never empty. ---
          $appNotes = if ($highlights) { $highlights } else { $detail }
          $below = @()
          if ($highlights -and $detail) {
            $below += "<details>`n<summary>전체 변경 내역</summary>`n`n$detail`n`n</details>"
          }
          $body = $appNotes + "`n`n<!--BLINK_NOTES_END-->"
          if ($below.Count -gt 0) { $body += "`n`n" + ($below -join "`n`n") }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          gh release edit $tag --notes-file release-notes.md

      # NOTE: No bridge installer. Existing Inno users do NOT auto-update across the boundary;
      # they are notified directly to uninstall the old Blink once and install the Velopack build
      # (small, reachable user base — decision 2026-06-19). New users install the Velopack Setup
      # and get clean auto-updates from here on.
